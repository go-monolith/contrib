name: go-test-jwt

on:
  pull_request:
    branches: [main]
    paths:
      - 'v1/jwt/**/*.go'
      - 'v1/jwt/go.mod'
      - 'v1/jwt/go.sum'
      - 'Makefile'
      - '.golangci.yml'
      - '.github/workflows/go-test-jwt.yaml'

concurrency:
  group: go-test-jwt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'minimum' is the go directive of go.mod, the oldest Go the module
        # supports. 'oldstable' tested nothing more than 'stable' once go.mod
        # required a newer Go than it: the go command downloaded that newer one.
        go-version: ['minimum', 'stable']

    name: jwt - Go ${{ matrix.go-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version != 'minimum' && matrix.go-version || '' }}
          go-version-file: ${{ matrix.go-version == 'minimum' && 'v1/jwt/go.mod' || '' }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-jwt-${{ hashFiles('v1/jwt/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-jwt-
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Install dependencies
        run: cd v1/jwt && go mod download

      - name: Check go.mod and go.sum are tidy
        run: cd v1/jwt && go mod tidy -diff

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Build the linter with the runner's Go toolchain. A prebuilt binary
          # panics with "file requires newer Go version" once setup-go's
          # 'stable' moves past the Go version the binary was built with.
          install-mode: goinstall
          version: v2.15.0
          args: --timeout=5m
          working-directory: v1/jwt

      - name: Run Go build
        run: cd v1/jwt && go build ./...

      - name: Run Go tests with race detector
        run: cd v1/jwt && go test -race -v ./...