# Template processed by go-release.yaml workflow
# {{PACKAGE}} and {{DIRECTORY}} are substituted at runtime via sed
name-template: '{{PACKAGE}} - v$RESOLVED_VERSION'
tag-template: '{{PACKAGE}}/v$RESOLVED_VERSION'
tag-prefix: {{PACKAGE}}/v
# A path prefix, not a glob: the paths are passed to GitHub's commit history
# query, which matches them literally ('v1/jwt/**' matched no commit at all).
include-paths:
  - {{DIRECTORY}}
categories:
  - title: '❗ Breaking Changes'
    labels:
      - '❗ BreakingChange'
  - title: '🚀 New'
    labels:
      - '✏️ Feature'
  - title: '🧹 Updates'
    labels:
      - '🧹 Updates'
      - '🤖 Dependencies'
      - 'dependencies'
  - title: '🐛 Fixes'
    labels:
      - '☢️ Bug'
  - title: '📚 Documentation'
    labels:
      - '📒 Documentation'
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'
exclude-contributors:
  - dependabot
  - dependabot[bot]
# No label resolves a major version: a major release is always set by hand, by
# changing the draft's version before publishing it. A breaking change resolves
# a minor version, as for a v0 module, and so does the 'major' label.
version-resolver:
  # Kept, with no labels: the schema gives a missing key no default.
  major:
    labels: []
  minor:
    labels:
      - 'major'
      - '❗ BreakingChange'
      - 'minor'
      - '✏️ Feature'
  patch:
    labels:
      - 'patch'
      - '📒 Documentation'
      - '☢️ Bug'
      - '🤖 Dependencies'
      - 'dependencies'
      - '🧹 Updates'
  default: patch
template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...{{PACKAGE}}/v$RESOLVED_VERSION

  Thank you $CONTRIBUTORS for making this update possible.
